<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Davao Interactive Map</title>

    <script src="https://unpkg.com/maplibre-gl@^4.0.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@^4.0.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="src/locations.js" defer></script>
    <script src="src/categories.js" defer></script>
    <script src="src/map.js" defer></script>
    <script src="src/popup.js" defer></script>
    <link href="style.css" rel="stylesheet" />
  </head>

  <body>

    <div class="hud">
      <h1>Davao Explorer</h1>
      <p>Click locations to open reviews, tips, ratings, and photos.</p>

      <div id="legend-container" class="legend">
      </div>
    </div>

    <div id="map"></div>

    <div class="popup" id="popup">
      <div class="popup-header">
	<div>
	  <div class="popup-title" id="popupTitle"></div>
	  <div class="popup-category" id="popupCategory"></div>
	</div>
	<button class="close-btn" id="closeBtn">&times;</button>
      </div>

      <img id="popupImage" class="popup-image"/>

      <div class="section">
	<div class="cost-row">
	  <div>
            <h3 class="cost-header">COST</h3>
            <p id="popupCost"></p>
	  </div>

	  <a id="popupMapLink" target="_blank" rel="noopener noreferrer" class="map-link">
            Open in Google Maps
	  </a>
	</div>
      </div>

      <div class="section">
	<h3>PERSONAL REVIEW</h3>
	<p id="popupReview"></p>
      </div>

      <div class="section">
	<h3>TIPS</h3>
	<ul id="popupTips"></ul>
      </div>

      <div class="section">
	<h3>RATINGS</h3>
	<div class="ratings" id="popupRatings"></div>
      </div>
    </div>
  </body>
</html>

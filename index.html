<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Davao Interactive Map</title>

  <script src="https://unpkg.com/maplibre-gl@^4.0.0/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@^4.0.0/dist/maplibre-gl.css" rel="stylesheet" />

  <style>
    :root {
      --bg: #050816;
      --panel: rgba(12, 18, 30, 0.88);
      --border: rgba(255,255,255,0.08);
      --text: #eef4ff;
      --muted: #93a4c3;
      --neon-blue: #00d9ff;
      --neon-pink: #ff2fd1;
      --neon-green: #00ffa3;
      --neon-orange: #ff9f43;
      --shadow: 0 0 25px rgba(0,217,255,0.2);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: var(--bg); font-family: Inter, Arial, sans-serif; color: var(--text); }

    #map { width: 100vw; height: 100vh; position: absolute; top: 0; bottom: 0; }

    .hud {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 50;
      width: 340px;
      background: var(--panel);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 18px;
      box-shadow: var(--shadow);
      pointer-events: none;
    }
    .hud * { pointer-events: auto; }
    .hud h1 { font-size: 24px; color: var(--neon-blue); margin-bottom: 6px; }
    .hud p { color: var(--muted); font-size: 13px; line-height: 1.5; }

    .legend { margin-top: 16px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .legend-item { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .legend-color { width: 12px; height: 12px; border-radius: 999px; }

    /* POPUP STYLES - RESTORED */
    .popup {
      position: fixed;
      top: 50%;
      right: 40px;
      transform: translateY(-50%) scale(0.95);
      width: 430px;
      max-height: 90vh;
      overflow-y: auto;
      background: rgba(15, 20, 32, 0.92);
      border: 1px solid var(--border);
      backdrop-filter: blur(20px);
      border-radius: 22px;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: 0.25s ease;
      z-index: 100;
      box-shadow: 0 0 50px rgba(0,0,0,0.6), 0 0 25px rgba(0,217,255,0.15);
    }

    .popup.active { opacity: 1; pointer-events: auto; transform: translateY(-50%) scale(1); }
    .popup-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 18px; }
    .popup-title { font-size: 28px; font-weight: 700; color: var(--neon-blue); }
    .popup-category { margin-top: 6px; display: inline-block; background: rgba(255,255,255,0.08); padding: 4px 10px; border-radius: 999px; color: var(--muted); font-size: 12px; text-transform: capitalize;}
    .close-btn { border: none; background: transparent; color: white; font-size: 28px; cursor: pointer; }
    .popup-image { width: 100%; height: 240px; object-fit: cover; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 20px; }
    .section { margin-bottom: 20px; }
    .section h3 { margin-bottom: 10px; color: var(--neon-pink); font-size: 15px; letter-spacing: 1px; }
    .section p, .section li { color: var(--muted); line-height: 1.7; font-size: 14px; }
    .ratings { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .rating-card { flex: 1; min-width: 90px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); padding: 10px; border-radius: 14px; text-align: center; }
    .rating-card span { display: block; color: var(--neon-green); font-size: 20px; font-weight: bold; margin-bottom: 4px; }
  </style>
</head>
<body>

<div class="hud">
  <h1>Davao Explorer</h1>
  <p>Click glowing locations to open reviews, tips, ratings, and photos.</p>
  <div class="legend">
    <div class="legend-item"><div class="legend-color" style="background:#00d9ff"></div>Attractions</div>
    <div class="legend-item"><div class="legend-color" style="background:#ff2fd1"></div>Restaurants</div>
    <div class="legend-item"><div class="legend-color" style="background:#00ffa3"></div>Malls</div>
    <div class="legend-item"><div class="legend-color" style="background:#ff9f43"></div>Cafes</div>
  </div>
</div>

<div id="map"></div>

<div class="popup" id="popup">
  <div class="popup-header">
    <div>
      <div class="popup-title" id="popupTitle"></div>
      <div class="popup-category" id="popupCategory"></div>
    </div>
    <button class="close-btn" id="closeBtn">&times;</button>
  </div>
  <img id="popupImage" class="popup-image"/>
  <div class="section">
    <h3>PERSONAL REVIEW</h3>
    <p id="popupReview"></p>
  </div>
  <div class="section">
    <h3>TIPS</h3>
    <ul id="popupTips"></ul>
  </div>
  <div class="section">
    <h3>RATINGS</h3>
    <div class="ratings" id="popupRatings"></div>
  </div>
</div>

<script>
  const LOCATIONS = [
    {
      name: "People's Park",
      category: "park",
      lat: 7.070652, lng: 125.608512,
      image: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1200",
      review: "Beautiful public park in the middle of the city. Very relaxing at night and surprisingly clean.",
      tips: ["Best visited around sunset", "Try local street food nearby", "Good photography spot"],
      ratings: { Atmosphere: 9, Crowds: 7, Safety: 9, Value: 10 }
    },
    {
      name: "Crocodile Park Picnic Grounds",
      category: "attraction",
      lat: 7.0981100, lng: 125.5981083,
      image: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1200",
      review: "Nice attractions but most animals are behind cages. They have an orangutan named Orange and a white tiger. The show is always the same. The guided tour is free and has good info on the animals.",
      tips: ["Do the guided tour", "Sit in the middle if you want the best spot for the show", "Bring an umbrella in case it rains"],
      ratings: { Walkability: 10, Activities: 3, Animals: 7, Value: 7 }
    },
    {
      name: "Abreeza Mall",
      category: "mall",
      lat: 7.09122, lng: 125.61134,
      image: "https://images.unsplash.com/photo-1519567241046-7f570eee3ce6?q=80&w=1200",
      review: "Modern mall with lots of food options and a more premium relaxed atmosphere.",
      tips: ["Weekdays are quieter", "Great coffee spots", "Cinema is excellent"],
      ratings: { Shopping: 9, Food: 9, Comfort: 10, Parking: 8 }
    },
    {
      name: "Roxas Night Market",
      category: "market",
      lat: 7.071924, lng: 125.612201,
      image: "https://images.unsplash.com/photo-1523906630133-f6934a1ab2b9?q=80&w=1200",
      review: "One of the best places for cheap food and authentic Davao nightlife.",
      tips: ["Bring cash", "Gets crowded late at night", "Try grilled seafood"],
      ratings: { Food: 10, Price: 10, Crowds: 5, Experience: 10 }
    }
  ];

  const CATEGORY_COLORS = {
    attraction: "#00d9ff",
    restaurant: "#ff2fd1",
    park: "#ff2fd1",
    market: "#ff2fd1",
    mall: "#00ffa3",
    cafe: "#ff9f43"
  };

  const DAVAO_BOUNDS = [
    [125.35, 6.95], 
    [125.85, 7.25]
  ];

  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
    center: [125.6128, 7.0731],
    zoom: 13,
    maxBounds: DAVAO_BOUNDS
  });

  map.on('load', () => {
    // We stringify the objects/arrays because GeoJSON properties must be flat
    const geojson = {
      type: 'FeatureCollection',
      features: LOCATIONS.map(loc => ({
        type: 'Feature',
        geometry: { type: 'Point', coordinates: [loc.lng, loc.lat] },
        properties: { 
          ...loc, 
          tips: JSON.stringify(loc.tips),
          ratings: JSON.stringify(loc.ratings),
          color: CATEGORY_COLORS[loc.category] 
        }
      }))
    };

    map.addSource('places', { type: 'geojson', data: geojson });

    // SNAPPY NODES (GPU Rendered)
    map.addLayer({
      id: 'nodes',
      type: 'circle',
      source: 'places',
      paint: {
        'circle-radius': 10,
        'circle-color': ['get', 'color'],
        'circle-stroke-width': 2,
        'circle-stroke-color': '#ffffff'
      }
    });

    // LABELS ABOVE NODES
    map.addLayer({
      id: 'node-labels',
      type: 'symbol',
      source: 'places',
      layout: {
        'text-field': ['get', 'name'],
        'text-font': ['Open Sans Bold'],
        'text-size': 12,
        'text-offset': [0, -1.8],
        'text-anchor': 'bottom'
      },
      paint: {
        'text-color': '#ffffff',
        'text-halo-color': 'rgba(0,0,0,0.8)',
        'text-halo-width': 1.5
      }
    });

    map.on('click', 'nodes', (e) => {
      const props = e.features[0].properties;
      openPopup({
        ...props,
        tips: JSON.parse(props.tips),
        ratings: JSON.parse(props.ratings)
      });
      map.flyTo({ center: e.features[0].geometry.coordinates, zoom: 15 });
    });

    map.on('mouseenter', 'nodes', () => map.getCanvas().style.cursor = 'pointer');
    map.on('mouseleave', 'nodes', () => map.getCanvas().style.cursor = '');
  });

  function openPopup(location) {
    const popup = document.getElementById("popup");
    popup.classList.add("active");

    document.getElementById("popupTitle").textContent = location.name;
    document.getElementById("popupCategory").textContent = location.category;
    document.getElementById("popupImage").src = location.image;
    document.getElementById("popupReview").textContent = location.review;

    const tipsContainer = document.getElementById("popupTips");
    tipsContainer.innerHTML = "";
    location.tips.forEach(tip => {
      const li = document.createElement("li");
      li.textContent = tip;
      tipsContainer.appendChild(li);
    });

    const ratingsContainer = document.getElementById("popupRatings");
    ratingsContainer.innerHTML = "";
    Object.entries(location.ratings).forEach(([k,v]) => {
      const card = document.createElement("div");
      card.className = "rating-card";
      card.innerHTML = `<span>${v}/10</span>${k}`;
      ratingsContainer.appendChild(card);
    });
  }

  document.getElementById("closeBtn").addEventListener("click", () => {
    document.getElementById("popup").classList.remove("active");
  });
</script>

</body>
</html>
